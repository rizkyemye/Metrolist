name: LizMusic Debug Build

# Build APK debug tanpa perlu secrets (untuk fork pribadi).
# Cara pakai: tab Actions -> "LizMusic Debug Build" -> Run workflow -> tunggu -> download artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Siapkan debug keystore
        run: |
          keytool -genkeypair -v -keystore app/persistent-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Izin gradlew
        run: chmod +x gradlew

      - name: Build APK debug (foss)
        env:
          METROLIST_APP_NAME: LizMusic
        run: ./gradlew --console=plain :app:assembleFossDebug -x lint -x lintFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lizmusic-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
